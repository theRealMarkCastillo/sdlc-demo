services:
  db:
    container_name: sdlc-staging-db-1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdlc_demo
      POSTGRES_USER: sdlc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc_user -d sdlc_demo"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    container_name: sdlc-staging-app-1
    build: .
    ports:
      - "5001:5000"
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sdlc_demo
      DB_USER: sdlc_user
      DB_PASS: ${DB_PASS}
      SDLC_API_KEY: ${SDLC_API_KEY}
      SDLC_API_KEY_USER_ID: ${SDLC_API_KEY_USER_ID:-1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  staging_pgdata:
